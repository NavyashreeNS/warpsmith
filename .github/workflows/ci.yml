name: ci

# GitHub's hosted runners have no GPU, so CI cannot reproduce the measurements.
# It verifies the two things it can verify without one, both of which are the
# usual sources of rot in a project like this:
#
#   1. every kernel still compiles, for four GPU architectures, with no warnings
#      that were not there before;
#   2. the committed report and charts are exactly what the tooling produces from
#      the committed results, so the documented numbers cannot drift from the
#      measured ones.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: compile (${{ matrix.arch_name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "75"
            arch_name: "sm_75 Turing"
          - arch: "80"
            arch_name: "sm_80 Ampere A100"
          - arch: "86"
            arch_name: "sm_86 Ampere GA10x"
          - arch: "89"
            arch_name: "sm_89 Ada"
    steps:
      - uses: actions/checkout@v4

      # The full toolkit is installed rather than a hand-picked subset. The
      # reduction suite includes <cub/cub.cuh>, which moves between packages across
      # CUDA releases, and a build that fails because a header package was renamed
      # tells us nothing about the kernels.
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network

      - name: Show toolchain
        run: |
          nvcc --version
          cmake --version
          g++ --version | head -1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }}

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      # -Xptxas=-v prints per-kernel register and shared-memory usage. Surfacing
      # it in the log makes an accidental register spill visible in a diff of two
      # CI runs, which is otherwise very easy to miss.
      - name: Register and shared memory usage
        run: |
          cmake --build build --target clean
          cmake --build build --parallel "$(nproc)" 2>&1 | grep -E "ptxas info|spill" | sort -u | tee ptxas.txt
          if grep -qi "spill" ptxas.txt; then
            echo "::warning title=Register spills::A kernel is spilling registers to local memory"
          fi

      - name: Binaries exist and respond
        run: |
          test -x build/warpsmith_bench
          test -x build/warpsmith_test
          build/warpsmith_bench --list

  generated-docs:
    name: report and charts are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install charting dependencies
        run: python -m pip install --quiet matplotlib

      # The report is pure arithmetic and string formatting over the JSON, so it is
      # byte-reproducible on any platform. It gets the strict check.
      - name: Regenerate the report from the committed results
        run: python tools/report.py results/results.json --out results/REPORT.md

      - name: Fail if the report differs from what is committed
        run: |
          if ! git diff --quiet -- results/REPORT.md; then
            echo "results/REPORT.md does not match results/results.json."
            echo "Regenerate it with:"
            echo "  python tools/report.py results/results.json --out results/REPORT.md"
            git diff -- results/REPORT.md | head -60
            exit 1
          fi
          echo "The committed report matches the committed measurements."

      # The charts are deliberately NOT byte-compared. Matplotlib's SVG output
      # depends on its own version and on platform font rasterization, so a strict
      # diff here would fail for reasons unrelated to the data. What CI can verify
      # is that the charts regenerate cleanly from the committed results and that
      # every figure the documentation references actually exists.
      - name: Regenerate the charts from the committed results
        run: python tools/plot.py results/results.json --outdir /tmp/charts

      - name: Every referenced chart exists and is non-empty
        run: |
          missing=0
          for name in sgemm-progression sgemm-scaling cost-of-speed roofline \
                      bandwidth attention autotune; do
            for variant in "$name.svg" "$name-dark.svg"; do
              if [ ! -s "docs/charts/$variant" ]; then
                echo "::error::docs/charts/$variant is missing or empty"
                missing=1
              fi
              if [ ! -s "/tmp/charts/$variant" ]; then
                echo "::error::tools/plot.py did not produce $variant"
                missing=1
              fi
            done
          done
          exit $missing

      - name: Results JSON is well formed and internally consistent
        run: python tools/validate_results.py results/results.json
